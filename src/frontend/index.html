<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pomodoro task list</title>
    <link rel="icon" href="data:,">
    <script>
      (() => {
        const param = new URLSearchParams(window.location.search).get("clawpilotTheme");
        const theme = param === "dark" || param === "light"
          ? param
          : (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <link rel="stylesheet" href="/styles.css">
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <main>
      <h1>Pomodoro task list</h1>
      <section aria-labelledby="timer-heading">
        <h2 id="timer-heading">Focus timer</h2>
        <p id="countdown" role="timer">25:00</p>
        <div class="timer-controls">
          <button type="button" id="start-timer">Start timer</button>
          <button type="button" id="pause-timer">Pause timer</button>
          <button type="button" id="reset-timer">Reset timer</button>
        </div>
      </section>

      <section aria-labelledby="tasks-heading">
        <h2 id="tasks-heading">Tasks</h2>
        <form id="task-form">
          <label for="task-title">Task title</label>
          <div class="task-entry">
            <input id="task-title" name="title" type="text" autocomplete="off">
            <button type="submit">Add task</button>
          </div>
        </form>
        <p id="task-message" role="status" aria-live="polite"></p>
        <ul id="task-list"></ul>
      </section>
    </main>
  </body>
</html>
